<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Squares</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: white;
    }

    .square {
      width: 155px;
      height: 155px;
      background-color: pink;
      margin: 30px 0 48px;
      padding: 5px;
      box-sizing: border-box;
      font-size: 32px;
      transition: width 0.4s ease, height 0.4s ease;
    }

    /* Square 1 becomes longer horizontally */
    .square-1:hover {
      width: 70%;
    }

    /* Square 2 becomes larger in both directions */
    .square-2:hover {
      width: 205px;
      height: 205px;
    }
  </style>
</head>
<body>
  <div class="square square-1">1</div>
  <div class="square square-2">2</div>
</body>
</html>
